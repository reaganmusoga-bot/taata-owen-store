        const defaultRestaurantItems = [

            { id: 106, name: "Beans + Matooke", category: "Main Course", price: 12000, icon: "fa-solid fa-utensils",

            { id: 107, name: "Grilled Fish + Chips", category: "Main Course", price: 22000, icon: "fa-solid fa-fish",

            { id: 108, name: "Beef Stew + Rice", category: "Main Course", price: 20000, icon: "fa-solid fa-cow",
                description: "Tender beef in rich gravy", prepTime: "20 min", badge: null, inStock: true },
            { id: 109, name: "Fresh Juice (Passion)", category: "Beverages", price: 5000, icon: "fa-solid fa-wine-bottle",
                description: "Freshly squeezed", prepTime: "5 min", badge: null, inStock: true },
            { id: 110, name: "Soda (Can)", category: "Beverages", price: 3000, icon: "fa-solid fa-wine-bottle",
                description: "Chilled soft drink", prepTime: "2 min", badge: null, inStock: true },
            { id: 111, name: "Bottled Water", category: "Beverages", price: 2000, icon: "fa-solid fa-wine-bottle",
                description: "Pure mineral water", prepTime: "1 min", badge: null, inStock: true },
            { id: 112, name: "Milkshake", category: "Beverages", price: 8000, icon: "fa-solid fa-wine-bottle",
                description: "Creamy vanilla/strawberry", prepTime: "5 min", badge: "popular", inStock: true },
            { id: 113, name: "Extra Chapati", category: "Sides", price: 2000, icon: "fa-solid fa-bread-slice",
                description: "One extra fluffy chapati", prepTime: "3 min", badge: null, inStock: true },
            { id: 114, name: "Extra Rice", category: "Sides", price: 3000, icon: "fa-solid fa-seedling",
                description: "Extra steamed rice", prepTime: "5 min", badge: null, inStock: true },
            { id: 115, name: "Fresh Salad", category: "Sides", price: 4000, icon: "fa-solid fa-leaf",
                description: "Mixed greens with tomatoes", prepTime: "5 min", badge: null, inStock: true },
        ];

        let supermarketItems = JSON.parse(localStorage.getItem('taata_supermarket_items'));
        let restaurantItems = JSON.parse(localStorage.getItem('taata_restaurant_items'));

        if (!supermarketItems || supermarketItems.length === 0) {
            supermarketItems = defaultSupermarketItems;
            localStorage.setItem('taata_supermarket_items', JSON.stringify(supermarketItems));
        }
        if (!restaurantItems || restaurantItems.length === 0) {
            restaurantItems = defaultRestaurantItems;
            localStorage.setItem('taata_restaurant_items', JSON.stringify(restaurantItems));
        }

        const allProducts = [...supermarketItems.map(p => ({ ...p, type: 'supermarket' })), ...restaurantItems.map(p => ({ ...p,
            type: 'restaurant' }))];

        // ============================================================
        //  CUSTOMER APP LOGIC
        // ============================================================
        let currentUser = null;
        let isLoginMode = true;
        let cart = [];
        let supermarketFilter = 'All';
        let restaurantFilter = 'All';

        function getStorageKey() {
            return currentUser ? `taata_${currentUser}` : null;
        }

        function loadUserData() {
            const key = getStorageKey();
            if (!key) return { wallet: 0, points: 0 };
            return {
                wallet: parseInt(localStorage.getItem(`${key}_wallet`)) || 0,
                points: parseInt(localStorage.getItem(`${key}_points`)) || 0
            };
        }

        function saveUserData(wallet, points) {
            const key = getStorageKey();
            if (key) {
                localStorage.setItem(`${key}_wallet`, wallet);
                localStorage.setItem(`${key}_points`, points);
            }
        }

        // ============================================================
        //  AUTH FUNCTIONS
        // ============================================================
        window.toggleAuthModal = function() {
            document.getElementById('authModal').classList.toggle('active');
            document.getElementById('authMessage').textContent = '';
        };

        window.toggleAuthMode = function() {
            isLoginMode = !isLoginMode;
            const title = document.getElementById('authTitle');
            const btn = document.getElementById('authActionBtn');
            const link = document.getElementById('authToggleLink');
            if (isLoginMode) {
                title.textContent = 'Welcome Back';
                btn.textContent = 'Login';
                link.innerHTML = `Don't have an account? <strong>Sign Up</strong>`;
            } else {
                title.textContent = 'Create Account';
                btn.textContent = 'Sign Up';
                link.innerHTML = `Already have an account? <strong>Login</strong>`;
            }
        };

        window.handleAuth = function() {
            const username = document.getElementById('authUsername').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            const msg = document.getElementById('authMessage');
            if (!username || !password) { msg.textContent = '⚠️ Fill in all fields.';
                msg.style.color = 'red'; return; }
            let users = JSON.parse(localStorage.getItem('taata_users')) || {};
            if (isLoginMode) {
                if (users[username] && users[username].password === password) {
                    currentUser = username;
                    document.getElementById('accountNameDisplay').textContent = username;
                    toggleAuthModal();
                    updateAccountModal();
                    updateCartUI();
                    msg.textContent = '';
                } else {
                    msg.textContent = '❌ Invalid username/password.';
                    msg.style.color = 'red';
                }
            } else {
                if (users[username]) { msg.textContent = '❌ Username exists.';
                    msg.style.color = 'red'; return; }
                users[username] = { password: password };
                localStorage.setItem('taata_users', JSON.stringify(users));
                currentUser = username;
                document.getElementById('accountNameDisplay').textContent = username;
                toggleAuthModal();
                updateAccountModal();
                updateCartUI();
            }
        };

        window.toggleAccountModal = function() {
            if (!currentUser) {
                toggleAuthModal();
                return;
            }
            const modal = document.getElementById('accountModal');
            modal.classList.toggle('active');
            if (modal.classList.contains('active')) {
                updateAccountModal();
            }
        };

        function updateAccountModal() {
            if (!currentUser) return;
            const data = loadUserData();
            document.getElementById('accountModalName').textContent = currentUser;
            document.getElementById('accountModalWallet').textContent = `UGX ${data.wallet.toLocaleString()}`;
            document.getElementById('accountModalPoints').textContent = data.points.toLocaleString();
            document.getElementById('walletBalanceDisplay').textContent = data.wallet.toLocaleString();
        }

        window.logoutUser = function() {
            if (currentUser) {
                const d = loadUserData();
                saveUserData(d.wallet, d.points);
                currentUser = null;
                document.getElementById('accountNameDisplay').textContent = 'Login';
                document.getElementById('accountModal').classList.remove('active');
                updateCartUI();
                alert('✅ Logged out successfully.');
            }
        };

        function getWalletBalance() { return loadUserData().wallet; }

        function getPointsBalance() { return loadUserData().points; }

        function setWalletBalance(v) { const d = loadUserData();
            saveUserData(v, d.points); }

        function setPointsBalance(v) { const d = loadUserData();
            saveUserData(d.wallet, v); }

        window.depositMoney = function() {
            if (!currentUser) { alert('⚠️ Please Login first.'); return; }
            const amount = prompt("Enter amount to deposit (UGX):", "10000");
            if (amount && parseInt(amount) > 0) {
                let bal = getWalletBalance();
                bal += parseInt(amount);
                setWalletBalance(bal);
                updateAccountModal();
                updateCartUI();
                alert(`✅ UGX ${parseInt(amount).toLocaleString()} added to your wallet!`);
            }
        };

        // ============================================================
        //  SEARCH
        // ============================================================
        window.searchProducts = function() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            document.querySelectorAll('.product-card').forEach(card => {
                const text = card.textContent.toLowerCase();
                card.classList.toggle('hidden', query !== '' && !text.includes(query));
            });
            document.querySelectorAll('.no-search-results').forEach(el => el.remove());
            ['supermarketGrid', 'restaurantGrid'].forEach(gridId => {
                const grid = document.getElementById(gridId);
                const visible = grid.querySelectorAll('.product-card:not(.hidden)');
                if (visible.length === 0 && grid.querySelectorAll('.product-card').length > 0) {
                    const msg = document.createElement('p');
                    msg.className = 'no-search-results';
                    msg.style.cssText =
                        'grid-column:1/-1; text-align:center; padding:40px; color:#888; font-size:1.1rem;';
                    msg.textContent = 'No products match your search. Try a different keyword.';
                    grid.parentElement.appendChild(msg);
                }
            });
        };

        // ============================================================
        //  UI RENDERING
        // ============================================================
        function getCategories(items) {
            const cats = items.map(item => item.category);
            return ['All', ...new Set(cats)];
        }

        function getCategoryIcon(cat) {
            const map = {
                'All': 'fa-solid fa-grid-2',
                'Fresh Produce': 'fa-solid fa-leaf',
                'Meat & Poultry': 'fa-solid fa-drumstick-bite',
                'Dairy & Eggs': 'fa-solid fa-egg',
                'Bakery': 'fa-solid fa-bread-slice',
                'Pantry Staples': 'fa-solid fa-boxes-stacked',
                'Beverages': 'fa-solid fa-wine-bottle',
                'Snacks & Sweets': 'fa-solid fa-cookie',
                'Frozen Foods': 'fa-solid fa-snowflake',
                'Household Supplies': 'fa-solid fa-soap',
                'Personal Care': 'fa-solid fa-tooth',
                'Fast Food': 'fa-solid fa-burger',
                'Main Course': 'fa-solid fa-utensils',
                'Sides': 'fa-solid fa-plate-wheat'
            };
            return map[cat] || 'fa-solid fa-tag';
        }

        function renderCategoryPills(containerId, items, activeFilter, gridId, type) {
            const container = document.getElementById(containerId);
            const categories = getCategories(items);
            container.innerHTML = '';
            categories.forEach(cat => {
                const count = cat === 'All' ? items.length : items.filter(i => i.category === cat).length;
                const pill = document.createElement('div');
                pill.className = `category-pill ${cat === activeFilter ? 'active' : ''}`;
                pill.innerHTML = `<i class="${getCategoryIcon(cat)}"></i> ${cat} <span class="count">(${count})</span>`;
                pill.onclick = () => {
                    if (type === 'supermarket') {
                        supermarketFilter = cat;
                        renderCategoryPills('supermarketCategoryPills', supermarketItems, supermarketFilter,
                            'supermarketGrid', 'supermarket');
                        renderGrid('supermarketGrid', supermarketItems, supermarketFilter);
                    } else {
                        restaurantFilter = cat;
                        renderCategoryPills('restaurantCategoryPills', restaurantItems, restaurantFilter,
                            'restaurantGrid', 'restaurant');
                        renderGrid('restaurantGrid', restaurantItems, restaurantFilter);
                    }
                    searchProducts();
                };
                container.appendChild(pill);
            });
        }

        function renderGrid(gridId, items, filterCategory = 'All') {
            const grid = document.getElementById(gridId);
            grid.innerHTML = '';
            const filtered = filterCategory === 'All' ? items : items.filter(item => item.category === filterCategory);
            if (filtered.length === 0) {
                grid.innerHTML =
                    `<p style="grid-column:1/-1; text-align:center; padding:40px; color:#888;">No items in this category.</p>`;
                return;
            }
            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'product-card';
                let badgeHtml = '';
                if (item.badge === 'special') badgeHtml =
                    `<span class="badge badge-special"><i class="fas fa-crown"></i> Chef's Special</span>`;
                else if (item.badge === 'popular') badgeHtml =
                    `<span class="badge badge-popular"><i class="fas fa-fire"></i> Popular</span>`;
                let metaHtml = item.prepTime ? `<div class="meta-info"><i class="fas fa-clock"></i> ${item.prepTime}</div>` :
                    '';
                let descHtml = item.description ? `<div class="description">${item.description}</div>` : '';
                const stockHtml =
                    `<span class="stock-badge ${item.inStock ? 'in-stock' : 'out-of-stock'}">${item.inStock ? '✅ In Stock' : '❌ Out of Stock'}</span>`;
                const disabledAttr = item.inStock ? '' : 'disabled';
                card.innerHTML = `
                        ${badgeHtml}
                        <div class="icon"><i class="${item.icon}"></i></div>
                        <span class="category-tag">${item.category}</span>
                        <h3>${item.name}</h3>
                        ${descHtml}
                        ${metaHtml}
                        <div class="price">UGX ${item.price.toLocaleString()}</div>
                        ${stockHtml}
                        <button onclick="addToCart(${item.id})" ${disabledAttr}><i class="fas fa-plus"></i> ${item.inStock ? 'Add' : 'Unavailable'}</button>
                    `;
                grid.appendChild(card);
            });
        }

        // ============================================================
        //  🛒 CART LOGIC (FIXED)
        // ============================================================
        window.addToCart = function(id) {
            try {
                const product = allProducts.find(p => p.id === id);
                if (!product) { alert('Product not found!'); return; }
                if (!product.inStock) { alert('Sorry, this item is out of stock.'); return; }

                const existing = cart.find(c => c.id === id && c.type === product.type);
                if (existing) {
                    existing.qty += 1;
                } else {
                    cart.push({ ...product, qty: 1 });
                }
                updateCartUI();
                alert(`✅ Added: ${product.name}`);
            } catch (e) {
                console.error("Add to cart error:", e);
                alert("Error adding item.");
            }
        };

        window.removeFromCart = function(id, type) {
            try {
                const index = cart.findIndex(c => c.id === id && c.type === type);
                if (index === -1) return;
                if (cart[index].qty > 1) {
                    cart[index].qty -= 1;
                } else {
                    cart.splice(index, 1);
                }
                updateCartUI();
            } catch (e) {
                console.error("Remove from cart error:", e);
            }
        };

        function updateCartUI() {
            try {
                const totalItems = cart.reduce((sum, c) => sum + c.qty, 0);
                document.getElementById('cartCount').textContent = totalItems;
                const floatingCount = document.getElementById('floatingCartCount');
                if (floatingCount) floatingCount.textContent = totalItems;
                const floatingBtn = document.getElementById('floatingCheckoutBtn');
                if (floatingBtn) {
                    if (totalItems > 0) floatingBtn.style.display = 'block';
                    else floatingBtn.style.display = 'none';
                }

                if (currentUser) {
                    const data = loadUserData();
                    document.getElementById('walletBalanceDisplay').textContent = data.wallet.toLocaleString();
                    if (document.getElementById('accountModal').classList.contains('active')) {
                        updateAccountModal();
                    }
                }

                const container = document.getElementById('cartItems');
                const summaryContainer = document.getElementById('cartSummary');
                if (!container) return;

                if (cart.length === 0) {
                    container.innerHTML =
                    '<p style="color:#888; text-align:center; margin-top:20px;">🛒 Your cart is empty.</p>';
                    if (summaryContainer) summaryContainer.innerHTML = '';
                    return;
                }

                let html = '';
                let subtotal = 0;
                cart.forEach(item => {
                    const total = item.price * item.qty;
                    subtotal += total;
                    html += `
                        <div class="cart-item">
                            <div>
                                <div class="item-name">${item.name}</div>
                                <small>${item.type === 'supermarket' ? '🏪 Supermarket' : '🍽️ Restaurant'}</small>
                            </div>
                            <div>
                                <span class="item-price">UGX ${total.toLocaleString()}</span>
                                <div class="qty-controls">
                                    <button onclick="removeFromCart(${item.id}, '${item.type}')">-</button>
                                    <span>${item.qty}</span>
                                    <button onclick="addToCart(${item.id})">+</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;

                const location = document.getElementById('custLocation')?.value || 'jinja';
                const shipping = location === 'jinja' ? 5000 : 20000;
                const freeDelivery = subtotal >= 200000;

                let discount = 0;
                let walletPay = 0;
                let points = getPointsBalance();
                let wallet = getWalletBalance();

                const usePointsCheck = document.getElementById('usePoints');
                const useWalletCheck = document.getElementById('useWallet');

                if (usePointsCheck && usePointsCheck.checked && currentUser) {
                    discount = Math.min(points, Math.floor(subtotal / 1000) * 1000);
                }
                if (useWalletCheck && useWalletCheck.checked && currentUser) {
                    walletPay = Math.min(wallet, subtotal - discount);
                }

                let finalTotal = subtotal - discount - walletPay + (freeDelivery ? 0 : shipping);
                if (finalTotal < 0) finalTotal = 0;
                let pointsEarned = Math.floor(finalTotal / 1000);

                let summaryHtml = `
                    <div class="cart-total">
                        <p>Subtotal: UGX ${subtotal.toLocaleString()}</p>
                        ${discount > 0 ? `<p style="color:green;">Discount: - UGX ${discount.toLocaleString()}</p>` : ''}
                        ${walletPay > 0 ? `<p style="color:blue;">Wallet Paid: - UGX ${walletPay.toLocaleString()}</p>` : ''}
                        <p>Delivery: ${freeDelivery ? '🎉 FREE' : `UGX ${shipping.toLocaleString()}`}</p>
                        <hr>
                        <p style="color:var(--red); font-size:1.6rem;">Total: UGX ${finalTotal.toLocaleString()}</p>
                        ${currentUser ? `<p style="font-size:0.8rem; color:#888;">⭐ You'll earn ${pointsEarned} points</p>` : '<p style="color:red; font-size:0.8rem;">⚠️ Login to earn points</p>'}
                    </div>
                `;
                if (summaryContainer) summaryContainer.innerHTML = summaryHtml;

            } catch (e) {
                console.error("Update cart UI error:", e);
            }
        }

        window.toggleCart = function() {
            const sidebar = document.getElementById('cartSidebar');
            const overlay = document.getElementById('cartOverlay');
            if (!sidebar || !overlay) return;
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
            if (sidebar.classList.contains('open')) {
                updateCartUI();
            }
        };

        // Floating checkout button opens the cart sidebar
        document.getElementById('floatingCheckoutBtn').addEventListener('click', function() {
            toggleCart();
        });

        function toggleAddressField() {
            const isPickup = document.querySelector('input[name="orderType"]:checked')?.value === 'pickup';
            const addrInput = document.getElementById('custAddress');
            const addrLabel = document.getElementById('addressLabel');
            if (!addrInput || !addrLabel) return;
            if (isPickup) {
                addrInput.placeholder = 'Taata Owen Jinja Central (or specific pickup point)';
                addrLabel.textContent = 'Pickup Location';
            } else {
                addrInput.placeholder = 'Street, building, landmark';
                addrLabel.textContent = 'Delivery Address';
            }
        }

        // ============================================================
        //  ✅ CHECKOUT - PLACE ORDER (FIXED)
        // ============================================================
        window.placeOrder = function() {
            try {
                console.log("🚀 Place Order triggered!");

                const orderType = document.querySelector('input[name="orderType"]:checked')?.value || 'delivery';
                const name = document.getElementById('custName')?.value?.trim() || '';
                const phone = document.getElementById('custPhone')?.value?.trim() || '';
                const address = document.getElementById('custAddress')?.value?.trim() || '';
                const location = document.getElementById('custLocation')?.value || 'jinja';
                const paymentEl = document.querySelector('input[name="payment"]:checked');
                const payment = paymentEl ? paymentEl.value : 'momo';

                if (cart.length === 0) {
                    alert('❌ Your cart is empty! Add some items first.');
                    return;
                }
                if (!name) {
                    alert('⚠️ Please enter your full name.');
                    document.getElementById('custName')?.focus();
                    return;
                }
                if (!phone) {
                    alert('⚠️ Please enter your phone number.');
                    document.getElementById('custPhone')?.focus();
                    return;
                }
                if (orderType === 'delivery' && !address) {
                    alert('⚠️ Please enter a delivery address.');
                    document.getElementById('custAddress')?.focus();
                    return;
                }

                console.log("✅ Validation passed");

                let subtotal = cart.reduce((sum, c) => sum + (c.price * c.qty), 0);
                const shipping = location === 'jinja' ? 5000 : 20000;
                const freeDelivery = subtotal >= 200000;
                let discount = 0,
                    walletPay = 0;
                let finalTotal = subtotal + (freeDelivery ? 0 : shipping);
                let pointsEarned = 0;

                if (currentUser) {
                    let points = getPointsBalance();
                    const usePointsCheck = document.getElementById('usePoints');
                    if (usePointsCheck && usePointsCheck.checked) {
                        discount = Math.min(points, Math.floor(subtotal / 1000) * 1000);
                    }

                    let wallet = getWalletBalance();
                    const useWalletCheck = document.getElementById('useWallet');
                    if (useWalletCheck && useWalletCheck.checked) {
                        walletPay = Math.min(wallet, subtotal - discount);
                    }

                    finalTotal = subtotal - discount - walletPay + (freeDelivery ? 0 : shipping);
                    if (finalTotal < 0) finalTotal = 0;

                    if (walletPay > 0) setWalletBalance(wallet - walletPay);
                    if (discount > 0) setPointsBalance(points - discount);

                    pointsEarned = Math.floor(finalTotal / 1000);
                    if (pointsEarned > 0) setPointsBalance(getPointsBalance() + pointsEarned);

                    var pointsMsg = `⭐ Points Earned: ${pointsEarned}`;
                } else {
                    var pointsMsg = '⚠️ Create an account to earn points!';
                }

                const hasRestaurantItems = cart.some(item => item.type === 'restaurant');
                const estimatedTime = hasRestaurantItems ? '15-30 minutes' : '1-2 hours';
                const orderSummary = cart.map(c => `${c.name} x${c.qty}`).join(', ');
                const paymentMethod = {
                    momo: 'MTN Mobile Money',
                    airtel: 'Airtel Money',
                    card: 'Credit/Debit Card',
                    cash: 'Cash on Delivery'
                } [payment] || payment;
                const orderTypeLabel = orderType === 'delivery' ? '🚚 Delivery' : '🏪 Pickup';

                const orders = JSON.parse(localStorage.getItem('taata_orders')) || [];
                orders.push({
                    timestamp: new Date().toLocaleString(),
                    customer: name,
                    phone: phone,
                    address: address,
                    orderType: orderTypeLabel,
                    payment: paymentMethod,
                    items: orderSummary,
                    total: finalTotal,
                    pointsEarned: pointsEarned,
                    status: 'Pending'
                });
                localStorage.setItem('taata_orders', JSON.stringify(orders));

                console.log("✅ Order saved:", orders);

                alert(`
        ✅ ORDER PLACED SUCCESSFULLY!

        👤 Customer: ${name}
        📞 Phone: ${phone}
        📍 ${orderType === 'delivery' ? 'Delivery Address' : 'Pickup Location'}: ${address}
        🏷️ Order Type: ${orderTypeLabel}
        💳 Payment: ${paymentMethod}

        🛒 Items: ${orderSummary}
        💰 Total Paid: UGX ${finalTotal.toLocaleString()}
        ${pointsMsg}
        💵 Wallet Balance: UGX ${getWalletBalance().toLocaleString()}

        📌 NEXT STEPS:
        1️⃣ We will call you on ${phone} within 5 minutes to confirm.
        2️⃣ ${orderType === 'delivery' ? `Your order will arrive within ${estimatedTime}! 🏍️` : `Your order will be ready for pickup within ${estimatedTime} at Taata Owen Supermarket.`}
        
        Thank you for choosing Taata Owen! 🇺🇬
        `);

                cart = [];
                updateCartUI();
                toggleCart();
                document.getElementById('custName').value = '';
                document.getElementById('custPhone').value = '';
                document.getElementById('custAddress').value = '';

            } catch (error) {
                console.error("❌ Place order error:", error);
                alert("⚠️ Something went wrong. Please check the console (F12) and try again.");
            }
        };

        // ============================================================
        //  RESTAURANT STATUS
        // ============================================================
        function updateRestaurantStatus() {
            const now = new Date();
            const hours = now.getHours();
            const isOpen = hours >= 7 && hours < 22;
            const statusEl = document.getElementById('restaurantStatus');
            if (!statusEl) return;
            if (isOpen) {
                statusEl.className = 'status-open';
                statusEl.textContent = '🔴 Open Now';
            } else {
                statusEl.className = 'status-closed';
                statusEl.textContent = '⏰ Closed (Opens at 7 AM)';
            }
        }

        // ============================================================
        //  BACK TO TOP
        // ============================================================
        window.onscroll = function() {
            const btn = document.getElementById('backToTop');
            if (!btn) return;
            if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
                btn.style.display = 'block';
            } else {
                btn.style.display = 'none';
            }
        };

        window.scrollToTop = function() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // ============================================================
        //  ADMIN APP LOGIC
        // ============================================================
        window.showAdminLogin = function() {
            document.getElementById('adminLoginModal').classList.add('active');
            document.getElementById('adminPasswordInput').value = '';
            document.getElementById('adminLoginError').textContent = '';
            document.getElementById('adminPasswordInput').focus();
        };

        window.loginAdmin = function() {
            const password = document.getElementById('adminPasswordInput').value;
            if (password === 'admin123') {
                document.getElementById('adminLoginModal').classList.remove('active');
                document.getElementById('customerApp').style.display = 'none';
                document.getElementById('adminApp').style.display = 'block';
                sessionStorage.setItem('taata_admin_logged_in', 'true');
                renderAdminDashboard();
                renderAdminOrders();
                renderAdminProducts();
            } else {
                document.getElementById('adminLoginError').textContent = '❌ Incorrect password. Try again.';
            }
        };

        window.logoutAdmin = function() {
            sessionStorage.removeItem('taata_admin_logged_in');
            document.getElementById('adminApp').style.display = 'none';
            document.getElementById('customerApp').style.display = 'block';
        };

        window.showAdminSection = function(section) {
            document.querySelectorAll('.admin-sidebar button').forEach(b => b.classList.remove('active'));
            const btns = document.querySelectorAll('.admin-sidebar button');
            if (section === 'dashboard') btns[0].classList.add('active');
            else if (section === 'orders') btns[1].classList.add('active');
            else if (section === 'products') btns[2].classList.add('active');

            document.getElementById('adminDashboard').style.display = section === 'dashboard' ? 'block' : 'none';
            document.getElementById('adminOrders').style.display = section === 'orders' ? 'block' : 'none';
            document.getElementById('adminProducts').style.display = section === 'products' ? 'block' : 'none';

            if (section === 'dashboard') renderAdminDashboard();
            if (section === 'orders') renderAdminOrders();
            if (section === 'products') renderAdminProducts();
        };

        function renderAdminDashboard() {
            const orders = JSON.parse(localStorage.getItem('taata_orders')) || [];
            const totalOrders = orders.length;
            const totalRevenue = orders.reduce((sum, o) => sum + o.total, 0);
            const pending = orders.filter(o => o.status === 'Pending' || o.status === 'Preparing').length;

            document.getElementById('statTotalOrders').textContent = totalOrders;
            document.getElementById('statTotalRevenue').textContent = `UGX ${totalRevenue.toLocaleString()}`;
            document.getElementById('statPendingOrders').textContent = pending;
            document.getElementById('statTotalProducts').textContent = supermarketItems.length + restaurantItems.length;
        }

        window.sendWhatsApp = function(phone, customer, orderIndex, total) {
            let rawPhone = phone.replace(/\s/g, '');
            if (rawPhone.startsWith('0')) rawPhone = '256' + rawPhone.substring(1);
            if (!rawPhone.startsWith('256')) rawPhone = '256' + rawPhone;

            const msg = `Hello ${customer}, your order #${orderIndex + 1} (UGX ${total.toLocaleString()}) is ready for pickup/delivery at Taata Owen Supermarket! 🛍️ Thank you for choosing us. - Taata Owen Team`;
            const url = `https://wa.me/${rawPhone}?text=${encodeURIComponent(msg)}`;
            window.open(url, '_blank');
        };

        window.markOrderDelivered = function(index) {
            const orders = JSON.parse(localStorage.getItem('taata_orders')) || [];
            if (orders[index]) {
                orders[index].status = 'Delivered';
                localStorage.setItem('taata_orders', JSON.stringify(orders));
                renderAdminOrders();
                renderAdminDashboard();
                alert('✅ Order marked as Delivered!');
            }
        };

        window.clearDeliveredOrders = function() {
            let orders = JSON.parse(localStorage.getItem('taata_orders')) || [];
            const deliveredCount = orders.filter(o => o.status === 'Delivered').length;
            if (deliveredCount === 0) {
                alert('No delivered orders to clear.');
                return;
            }
            if (confirm(`Delete ${deliveredCount} completed orders? This cannot be undone.`)) {
                orders = orders.filter(o => o.status !== 'Delivered');
                localStorage.setItem('taata_orders', JSON.stringify(orders));
                renderAdminOrders();
                renderAdminDashboard();
                alert('✅ Delivered orders cleared!');
            }
        };

        function renderAdminOrders() {
            const container = document.getElementById('adminOrderList');
            const orders = JSON.parse(localStorage.getItem('taata_orders')) || [];
            if (orders.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding:20px; color:#888;">📭 No orders placed yet.</p>';
                return;
            }
            let html = `<table>
                        <thead><tr><th>#</th><th>Time</th><th>Customer</th><th>Phone</th><th>Type</th><th>Items</th><th>Total</th><th>Points</th><th>Status</th><th>Actions</th></tr></thead><tbody>`;
            orders.slice().reverse().forEach((order, index) => {
                const reversedIndex = orders.length - 1 - index;
                const statusOptions = ['Pending', 'Preparing', 'Out for Delivery', 'Delivered'];
                let statusSelect =
                    `<select class="status-select" onchange="updateOrderStatus(${reversedIndex}, this.value)" style="background:${getStatusColor(order.status)}">`;
                statusOptions.forEach(s => {
                    statusSelect +=
                        `<option value="${s}" ${s === order.status ? 'selected' : ''}>${s}</option>`;
                });
                statusSelect += `</select>`;

                html += `<tr>
                            <td>${reversedIndex + 1}</td>
                            <td>${order.timestamp}</td>
                            <td><strong>${order.customer}</strong></td>
                            <td>${order.phone}</td>
                            <td>${order.orderType}</td>
                            <td style="max-width:150px; word-break:break-word;">${order.items}</td>
                            <td><strong>UGX ${order.total.toLocaleString()}</strong></td>
                            <td>${order.pointsEarned || 0}</td>
                            <td>${statusSelect}</td>
                            <td>
                                <button class="btn-sm btn-whatsapp" onclick="sendWhatsApp('${order.phone}', '${order.customer}', ${reversedIndex}, '${order.total}')" title="Notify via WhatsApp"><i class="fab fa-whatsapp"></i> Notify</button>
                                ${order.status !== 'Delivered' ? `<button class="btn-sm btn-deliver" onclick="markOrderDelivered(${reversedIndex})" title="Mark as Delivered"><i class="fas fa-check-circle"></i> Deliver</button>` : ''}
                            </td>
                        </tr>`;
            });
            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        function getStatusColor(status) {
            const map = { 'Pending': '#fff3cd', 'Preparing': '#cce5ff', 'Out for Delivery': '#d4edda',
                'Delivered': '#d1ecf1' };
            return map[status] || 'white';
        }

        window.updateOrderStatus = function(index, newStatus) {
            const orders = JSON.parse(localStorage.getItem('taata_orders')) || [];
            if (orders[index]) {
                orders[index].status = newStatus;
                localStorage.setItem('taata_orders', JSON.stringify(orders));
                renderAdminOrders();
                renderAdminDashboard();
            }
        };

        function renderAdminProducts() {
            const container = document.getElementById('adminProductList');
            const allItems = [...supermarketItems, ...restaurantItems];
            let html = `<table>
                        <thead><tr><th>Name</th><th>Category</th><th>Price</th><th>Type</th><th>Stock</th><th>Actions</th></tr></thead><tbody>`;
            allItems.forEach(item => {
                const stockText = item.inStock ? '✅ In Stock' : '❌ Out of Stock';
                const stockColor = item.inStock ? 'in-stock-badge' : 'out-of-stock-badge';
                html += `<tr>
                            <td><strong>${item.name}</strong></td>
                            <td>${item.category}</td>
                            <td>UGX ${item.price.toLocaleString()}</td>
                            <td>${item.type === 'supermarket' ? '🏪 Supermarket' : '🍽️ Restaurant'}</td>
                            <td><span class="${stockColor}">${stockText}</span></td>
                            <td>
                                <button class="btn-sm btn-edit" onclick="editProduct(${item.id}, '${item.type}')"><i class="fas fa-edit"></i> Edit</button>
                                <button class="btn-sm toggle-stock-btn" onclick="toggleStock(${item.id}, '${item.type}')">Toggle Stock</button>
                                <button class="btn-sm btn-delete" onclick="deleteProduct(${item.id}, '${item.type}')"><i class="fas fa-trash"></i> Delete</button>
                            </td>
                        </tr>`;
            });
            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        window.toggleStock = function(id, type) {
            let items = type === 'supermarket' ? supermarketItems : restaurantItems;
            const item = items.find(p => p.id === id);
            if (item) {
                item.inStock = !item.inStock;
                if (type === 'supermarket') localStorage.setItem('taata_supermarket_items', JSON.stringify(items));
                else localStorage.setItem('taata_restaurant_items', JSON.stringify(items));
                renderAdminProducts();
                refreshCustomerUI();
            }
        };

        window.deleteProduct = function(id, type) {
            if (!confirm(`Delete this product permanently?`)) return;
            let items = type === 'supermarket' ? supermarketItems : restaurantItems;
            const index = items.findIndex(p => p.id === id);
            if (index !== -1) {
                items.splice(index, 1);
                if (type === 'supermarket') localStorage.setItem('taata_supermarket_items', JSON.stringify(items));
                else localStorage.setItem('taata_restaurant_items', JSON.stringify(items));
                renderAdminProducts();
                refreshCustomerUI();
            }
        };

        window.showAddProductForm = function() {
            const container = document.getElementById('adminProductFormContainer');
            container.innerHTML = `
                        <div class="product-form">
                            <input type="text" id="newProductName" placeholder="Product Name">
                            <input type="text" id="newProductCategory" placeholder="Category">
                            <input type="number" id="newProductPrice" placeholder="Price (UGX)">
                            <select id="newProductType">
                                <option value="supermarket">Supermarket</option>
                                <option value="restaurant">Restaurant</option>
                            </select>
                            <button onclick="addProduct()"><i class="fas fa-save"></i> Save Product</button>
                        </div>
                    `;
        };

        window.addProduct = function() {
            const name = document.getElementById('newProductName').value.trim();
            const category = document.getElementById('newProductCategory').value.trim();
            const price = parseInt(document.getElementById('newProductPrice').value);
            const type = document.getElementById('newProductType').value;
            if (!name || !category || !price) { alert('Please fill all fields.'); return; }

            const newId = type === 'supermarket' ? Math.max(0, ...supermarketItems.map(i => i.id)) + 1 : Math.max(100, ...restaurantItems
                .map(i => i.id)) + 1;

            const newItem = {
                id: newId,
                name: name,
                category: category,
                price: price,
                icon: "fa-solid fa-box",
                inStock: true,
                type: type
            };

            if (type === 'supermarket') {
                supermarketItems.push(newItem);
                localStorage.setItem('taata_supermarket_items', JSON.stringify(supermarketItems));
            } else {
                restaurantItems.push(newItem);
                localStorage.setItem('taata_restaurant_items', JSON.stringify(restaurantItems));
            }

            document.getElementById('adminProductFormContainer').innerHTML = '';
            renderAdminProducts();
            refreshCustomerUI();
            alert('✅ Product added successfully!');
        };

        window.editProduct = function(id, type) {
            let items = type === 'supermarket' ? supermarketItems : restaurantItems;
            const item = items.find(p => p.id === id);
            if (!item) return;

            const newName = prompt('Product Name:', item.name);
            if (newName === null) return;
            const newCategory = prompt('Category:', item.category);
            if (newCategory === null) return;
            const newPrice = prompt('Price (UGX):', item.price);
            if (newPrice === null) return;

            item.name = newName.trim();
            item.category = newCategory.trim();
            item.price = parseInt(newPrice);

            if (type === 'supermarket') localStorage.setItem('taata_supermarket_items', JSON.stringify(items));
            else localStorage.setItem('taata_restaurant_items', JSON.stringify(items));

            renderAdminProducts();
            refreshCustomerUI();
            alert('✅ Product updated!');
        };

        function refreshCustomerUI() {
            supermarketItems = JSON.parse(localStorage.getItem('taata_supermarket_items'));
            restaurantItems = JSON.parse(localStorage.getItem('taata_restaurant_items'));
            renderCategoryPills('supermarketCategoryPills', supermarketItems, supermarketFilter, 'supermarketGrid',
                'supermarket');
            renderGrid('supermarketGrid', supermarketItems, supermarketFilter);
            renderCategoryPills('restaurantCategoryPills', restaurantItems, restaurantFilter, 'restaurantGrid',
                'restaurant');
            renderGrid('restaurantGrid', restaurantItems, restaurantFilter);
            searchProducts();
        }

        // ============================================================
        //  INIT
        // ============================================================
        document.addEventListener('change', function(e) {
            if (e.target.id === 'custLocation' || e.target.id === 'useWallet' || e.target.id === 'usePoints' || e.target
                .name === 'orderType') {
                if (e.target.name === 'orderType') toggleAddressField();
                updateCartUI();
            }
        });

        // Admin session check
        if (sessionStorage.getItem('taata_admin_logged_in') === 'true') {
            document.getElementById('customerApp').style.display = 'none';
            document.getElementById('adminApp').style.display = 'block';
            renderAdminDashboard();
            renderAdminOrders();
            renderAdminProducts();
        } else {
            document.getElementById('customerApp').style.display = 'block';
            document.getElementById('adminApp').style.display = 'none';
        }

        // Render initial UI
        renderCategoryPills('supermarketCategoryPills', supermarketItems, 'All', 'supermarketGrid', 'supermarket');
        renderGrid('supermarketGrid', supermarketItems, 'All');
        renderCategoryPills('restaurantCategoryPills', restaurantItems, 'All', 'restaurantGrid', 'restaurant');
        renderGrid('restaurantGrid', restaurantItems, 'All');
        updateCartUI();
        updateRestaurantStatus();
        setInterval(updateRestaurantStatus, 60000);
        toggleAddressField();

        console.log('🔥 Taata Owen Supermarket & Restaurant is LIVE!');
        console.log('🔐 Admin Login: Click "Admin Login" at the bottom. Password: admin123');
        console.log('🛒 Cart & Checkout are FULLY ACTIVE.');
        console.log('📋 If checkout fails, check the console for errors.');
        console.log('💡 Floating checkout button added at bottom right.');
    </script>
</body>
</html>
